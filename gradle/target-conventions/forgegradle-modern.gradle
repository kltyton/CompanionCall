apply from: file('../../gradle/target-conventions/base.gradle')

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            mods {
                register(mod_id) {
                    source sourceSets.main
                    source project(':common').sourceSets.main
                }
            }
        }
        register('client')
        register('server') { args '--nogui' }
        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources').absolutePath,
                    *project.ext.templeDatagenExistingArgs
        }
    }
}
def mavenizerRepository = repositories.maven(minecraft.mavenizer)
repositories.remove(mavenizerRepository)
repositories.addFirst(mavenizerRepository)
repositories {
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}
dependencies { implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${loader_version}") }
apply from: file('../../gradle/target-conventions/pack-metadata.gradle')
apply from: file('../../gradle/target-conventions/publish.gradle')
